<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Your Hero</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4ead2; }
    h1 { text-align: center; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .hero-card { text-align: center; border: 1px solid #ccc; padding: 10px; border-radius: 8px; width: 150px; background: #fff; }
    .hero-card img { width: 100%; border-radius: 8px; }
    button { margin-top: 10px; padding: 8px 12px; border: none; background: #8b5e3c; color: white; border-radius: 4px; cursor: pointer; }
    button:hover { background: #a97452; }
  </style>
</head>
<body>
  <h1>Select Your Hero</h1>
  <div class="grid">
    <div class="hero-card">
      <img src="images/Mage.png" alt="Mage">
      <p>Mage</p>
      <button onclick="selectHero('Mage')">Select</button>
    </div>
    <div class="hero-card">
      <img src="images/Fighter.png" alt="Fighter">
      <p>Fighter</p>
      <button onclick="selectHero('Fighter')">Select</button>
    </div>
    <div class="hero-card">
      <img src="images/Minstrel.png" alt="Minstrel">
      <p>Minstrel</p>
      <button onclick="selectHero('Minstrel')">Select</button>
    </div>
    <div class="hero-card">
      <img src="images/Thief.png" alt="Thief">
      <p>Thief</p>
      <button onclick="selectHero('Thief')">Select</button>
    </div>
  </div>

  <script>
    function selectHero(heroName) {
      // Navigate to the form page with hero choice as query param
      window.location.href = `form.html?hero=${encodeURIComponent(heroName)}`;
    }
  </script>
</body>
</html>
