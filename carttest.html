<script id="fsb-cart-template" type="text/x-handlebars-template">

<div class="cart-wrapper">

{{#if groups}}

<h2>Your Cart</h2>

<div class="cart-items">

{{#each groups}}
{{#each items}}

{{#if selected}}

<div class="cart-item">

<div class="cart-name">
{{display}}
</div>

<div class="cart-qty">
<button onclick="fastspring.builder.update('{{path}}', {{quantity}} - 1)">−</button>

<input
type="number"
value="{{quantity}}"
min="0"
onchange="fastspring.builder.update('{{path}}', this.value)">

<button onclick="fastspring.builder.update('{{path}}', {{quantity}} + 1)">+</button>
</div>

<div class="cart-price">
{{priceTotal}}
</div>

<div class="cart-remove">
<button onclick="fastspring.builder.update('{{path}}', 0)">
Remove
</button>
</div>

</div>

{{/if}}
{{/each}}
{{/each}}

</div>


<div class="cart-summary">

<div class="cart-total">
Total: {{total}}
</div>

<div class="cart-coupon">
<input id="couponcode" placeholder="Promo code">
<button onclick="applycoupon()">Apply</button>
</div>

<div class="cart-checkout">
<button data-fsc-action="Checkout">
Checkout
</button>
</div>

</div>

{{else}}

<p>Your bag of holding is empty.</p>

{{/if}}

</div>

</script>
