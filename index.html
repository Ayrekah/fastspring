<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ready to Roll Store</title>

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-data-callback="onFscDataCallback"
        data-debug="true">
    </script>

    <style>
        body { font-family: sans-serif; margin: 40px; }
        .products { display: flex; gap: 20px; margin-bottom: 40px; }
        .product { border: 1px solid #ccc; padding: 15px; width: 220px; text-align: center; }
        .cart { border-top: 2px solid #000; padding-top: 20px; }
        .cart-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        /* REQUIRED: Forces SBL tags to be visible even when empty */
        [data-fsc-item-path] { display: block !important; }
    </style>
</head>
<body>

    <h1>Ready to Roll Store</h1>

    <div class="products">
        <div class="product">
            <img data-fsc-item-path="the-tavern" data-fsc-item-image width="200">
            <h3 data-fsc-item-path="the-tavern" data-fsc-item-display></h3>
            <p data-fsc-item-path="the-tavern" data-fsc-item-price></p>
            <button data-fsc-action="Add" data-fsc-item-path-value="the-tavern">Add to Party</button>
            <div class="qty-controls">
                <button onclick="changeQty('the-tavern', -1)">-</button>
                <span data-fsc-item-path="the-tavern" data-fsc-item-quantity>0</span>
                <button onclick="changeQty('the-tavern', 1)">+</button>
            </div>
        </div>

        <div class="product">
            <img data-fsc-item-path="the-campfire" data-fsc-item-image width="200">
            <h3 data-fsc-item-path="the-campfire" data-fsc-item-display></h3>
            <p data-fsc-item-path="the-campfire" data-fsc-item-price></p>
            <button data-fsc-action="Add" data-fsc-item-path-value="the-campfire">Add to Party</button>
            <div class="qty-controls">
                <button onclick="changeQty('the-campfire', -1)">-</button>
                <span data-fsc-item-path="the-campfire" data-fsc-item-quantity>0</span>
                <button onclick="changeQty('the-campfire', 1)">+</button>
            </div>
        </div>

        <div class="product">
            <img data-fsc-item-path="the-guild-hall" data-fsc-item-image width="200">
            <h3 data-fsc-item-path="the-guild-hall" data-fsc-item-display></h3>
            <p data-fsc-item-path="the-guild-hall" data-fsc-item-price></p>
            <button data-fsc-action="Add" data-fsc-item-path-value="the-guild-hall">Add to Party</button>
            <div class="qty-controls">
                <button onclick="changeQty('the-guild-hall', -1)">-</button>
                <span data-fsc-item-path="the-guild-hall" data-fsc-item-quantity>0</span>
                <button onclick="changeQty('the-guild-hall', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="cart">
        <h2>Your Character Party (Cart)</h2>
        
        <div data-fsc-items-container>
            <div class="cart-item" data-fsc-item-path-element>
                <img data-fsc-item-image width="50">
                <strong data-fsc-item-display></strong> 
                | Qty: <span data-fsc-item-quantity></span> 
                | Total: <span data-fsc-item-total></span>
                | <a href="#" data-fsc-action="Remove" style="color:red;">[Remove]</a>
            </div>
        </div>

        <div style="margin-top:20px; background:#f4f4f4; padding:15px; width:320px;">
            Subtotal: <span data-fsc-order-total></span><br>
            Tax: <span data-fsc-order-tax></span><br>
            <strong>Grand Total: <span data-fsc-order-totalWithTax></span></strong>
            <br><br>
            <button data-fsc-action="Checkout">Checkout</button>
            <button data-fsc-action="Reset">Clear All</button>
        </div>
    </div>

    <div id="fsc-embedded-checkout-container"></div>
    <script src="js/script.js"></script>
</body>
</html>
