<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | FastSpring SBL Integration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        /* CSS to handle the 'pulsing' (Skeleton) effect professionally */
        [data-fsc-item-path] { min-height: 20px; }
        
        #fsc-embedded-checkout-container {
            display: none; /* Controlled by onOrderItemsChanged */
            margin: 40px auto;
            min-height: 600px;
            border-top: 1px solid #ddd;
        }

        .product-card { padding: 20px; border: 1px solid #eee; height: 100%; }
        .product-card img { width: 100%; cursor: pointer; }
    </style>
</head>

<body>
    <header class="p-3 border-bottom sticky-top bg-white">
        <div class="container d-flex justify-content-between">
            <strong>READY TO ROLL</strong>
            <div>Total: <span data-fsc-order-total></span></div>
        </div>
    </header>

    <section class="container py-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="product-card">
               <img data-fsc-item-path="the-campfire" data-fsc-item-image src="" onclick="openFullDetails('the-campfire')">
                    <h3 class="mt-3" data-fsc-item-description-summary</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-campfire" data-fsc-item-image src="" onclick="openFullDetails('the-campfire')">
                    <h3 class="mt-3" data-fsc-item-path="the-campfire" data-fsc-item-display></h3>
                    <p class="text-muted" data-fsc-item-path="the-campfire" data-fsc-item-description-summary></p>
                    <div class="h4 text-primary" data-fsc-item-path="the-campfire" data-fsc-item-price></div>
                    <button class="btn btn-dark w-100 mt-2" 
                            data-fsc-item-path-value="the-campfire" 
                            data-fsc-action="Add"
                        Add to Cart
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-guild-hall" data-fsc-item-image src="" onclick="openFullDetails('the-guild-hall')">
                    <h3 class="mt-3" data-fsc-item-path="the-guild-hall" data-fsc-item-display></h3>
                    <p class="text-muted" data-fsc-item-path="the-guild-hall" data-fsc-item-description-summary></p>
                    <div class="h4 text-primary" data-fsc-item-path="the-guild-hall" data-fsc-item-price></div>
                    <button class="btn btn-dark w-100 mt-2" 
                            data-fsc-item-path-value="the-guild-hall" 
                            data-fsc-action="Add">
                        Add to Cart
                    </button>
                </div>
            </div>

        </div>
    </section>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalDescription"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <script type="text/javascript">
        /**
         * FASTSPRING SBL CALLBACKS
         */
        function onFscOrderItemsChanged(data) {
            console.log("SBL: Order Items Changed", data);
            
            if (data.items.length > 0) {
                // Display the embedded checkout container
                const checkout = document.getElementById('fsc-embedded-checkout-container');
                checkout.style.display = 'block';
                
                // UX: Ensure the checkout is rendered and visible
                fastspring.builder.checkout();
                
                setTimeout(() => {
                    checkout.scrollIntoView({ behavior: 'smooth' });
                }, 300);
            }
        }

        // REQUIRED GLOBAL OBJECT
        window.fastspring = {
            builder: {
                "onOrderItemsChanged": onFscOrderItemsChanged
            }
        };

        /**
         * INTERFACE FUNCTIONS
         */
        function openFullDetails(path) {
            const modal = new bootstrap.Modal(document.getElementById('detailModal'));
            
            // Accessing product data directly via the SBL object
            const item = fastspring.builder.item(path);
            
            if (item) {
                document.getElementById('modalTitle').innerText = item.display;
                document.getElementById('modalDescription').innerHTML = item.descriptionFull;
                modal.show();
            }
        }
    </script>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
