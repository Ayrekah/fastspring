<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Character Creator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-after-markup-callback="onFscReady">
    </script>

    <style>
        #fsc-embedded-checkout-container {
            display: none; 
            margin: 50px auto;
            max-width: 1100px;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            min-height: 600px;
        }
        .static-hero { background-color: #f3f5f7; padding: 100px 0; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>

<body data-bs-spy="scroll" data-bs-target="#navbar">

    <header id="header" class="site-header header-scrolled position-fixed text-black bg-light w-100" style="z-index: 1000;">
        <nav id="header-nav" class="navbar navbar-expand-lg px-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <h2 class="text-uppercase m-0">Ready to Roll</h2>
                </a>
                <div class="d-flex align-items-center">
                    <span class="me-3 text-muted">Cart Total: <strong class="text-dark" data-fsc-order-total>$0.00</strong></span>
                </div>
            </div>
        </nav>
    </header>

    <section id="billboard" class="static-hero position-relative overflow-hidden">
        <div class="container">
            <div class="row d-flex align-items-center">
                <div class="col-md-6">
                    <div class="banner-content">
                        <h1 class="display-2 text-uppercase text-dark pb-3">Craft Your Legend.</h1>
                        <p class="lead mb-5">Instant TTRPG character sheets and bespoke backstories.</p>
                        <a href="#ttrpg-products" class="btn btn-medium btn-dark text-uppercase btn-rounded-none">View Tiers</a>
                    </div>
                </div>
                <div class="col-md-5 offset-md-1 text-center">
                    <img src="https://googleusercontent.com/image_generation_content/5" alt="Hero" class="img-fluid rounded shadow-sm">
                </div>
            </div>
        </div>
    </section>

    <section id="ttrpg-products" class="product-store position-relative padding-large">
        <div class="container">
            <div class="row g-4">
                
                <div class="col-md-4" data-fsc-item-path="the-tavern">
                    <div class="product-card border p-4 text-center h-100">
                        <div class="image-holder">
                            <img data-fsc-item-image src="https://googleusercontent.com/image_generation_content/4" class="img-fluid">
                        </div>
                        <h3 class="mt-3 text-uppercase" data-fsc-item-display>The Tavern</h3>
                        <p class="small text-muted" data-fsc-item-description-summary>Randomized Starter Character</p>
                        <div class="mt-3">
                            <span class="h4 d-block mb-3 text-primary" data-fsc-item-price>$10.00</span>
                            <button type="button" data-fsc-item-path-value="the-tavern" data-fsc-action="Add" class="btn btn-dark w-100 text-uppercase">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4" data-fsc-item-path="hall-of-legends">
                    <div class="product-card border p-4 text-center h-100">
                        <div class="image-holder">
                            <img data-fsc-item-image src="https://googleusercontent.com/image_generation_content/6" class="img-fluid">
                        </div>
                        <h3 class="mt-3 text-uppercase" data-fsc-item-display>Hall of Legends</h3>
                        <p class="small text-muted" data-fsc-item-description-summary>Choose a Pre-made Hero</p>
                        <div class="mt-3">
                            <span class="h4 d-block mb-3 text-primary" data-fsc-item-price>$25.00</span>
                            <button type="button" data-fsc-item-path-value="hall-of-legends" data-fsc-action="Add" class="btn btn-dark w-100 text-uppercase">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
