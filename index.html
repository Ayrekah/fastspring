<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Character Creator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        /* CRITICAL: The landing strip must have height for the API to see it */
        #fsc-embedded-checkout-container {
            min-height: 650px !important;
            margin: 40px auto;
            border: 1px solid #eee;
            border-radius: 12px;
            display: none; /* We show this via JS below */
        }
        .static-hero { background-color: #f3f5f7; padding: 80px 0; }
        .product-card { border: 1px solid #ddd; padding: 20px; text-align: center; }
    </style>
</head>

<body>
    <header class="navbar navbar-light bg-light p-3">
        <a class="navbar-brand" href="#">READY TO ROLL</a>
        <div class="cart-total">Total: <span data-fsc-order-total>$0.00</span></div>
    </header>

    <section class="static-hero">
        <div class="container text-center">
            <h1>Craft Your Legend.</h1>
        </div>
    </section>

    <section class="container py-5">
        <div class="row">
            <div class="col-md-4" data-fsc-item-path="the-tavern">
                <div class="product-card">
                    <img data-fsc-item-image src="" class="img-fluid mb-2">
                    <h3 data-fsc-item-display>The Tavern</h3>
                    <p data-fsc-item-price>$10.00</p>
                    <button data-fsc-item-path-value="the-tavern" data-fsc-action="Add" class="btn btn-dark">Add to Cart</button>
                </div>
            </div>
            </div>
    </section>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <script type="text/javascript">
        function onFscOrderItemsChanged(data) {
            console.log("Ready to Roll: Cart Updated", data);
            
            if (data.items.length > 0) {
                // 1. Force the container to show
                const container = document.getElementById('fsc-embedded-checkout-container');
                container.style.display = 'block';
                
                // 2. Force SBL to render the checkout inside it
                fastspring.builder.checkout(); 
                
                // 3. Scroll to it
                setTimeout(() => {
                    container.scrollIntoView({ behavior: 'smooth' });
                }, 300);
            }
        }

        window.fastspring = {
            builder: {
                "onOrderItemsChanged": onFscOrderItemsChanged
            }
        };
    </script>
</body>
</html>
