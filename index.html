<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Character Creator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        #fsc-embedded-checkout-container { 
            min-height: 650px !important; 
            margin: 40px auto; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            display: none; 
            background: #fff; 
        }
        .product-card { border: 1px solid #eee; padding: 25px; border-radius: 10px; transition: 0.3s; background: #fff; cursor: pointer; }
        .product-card:hover { border-color: #000; transform: translateY(-5px); }
        .product-card img { width: 100%; height: auto; border-radius: 5px; margin-bottom: 15px; }
        .modal-body img { max-width: 100%; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>

<body>
    <header class="p-3 border-bottom bg-white sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-uppercase">Ready to Roll</h4>
            <div>Cart Total: <strong data-fsc-order-total>$0.00</strong></div>
        </div>
    </header>

    <section class="container py-5 text-center">
        <h1 class="display-4 text-uppercase mb-5">Select Your Tier</h1>
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="product-card h-100" onclick="openQuickView('the-tavern', 'The Tavern', 'A randomized level 1 character with a basic backstory and standard equipment. Perfect for a quick pick-up game.', 'https://googleusercontent.com/image_generation_content/4')">
                    <img src="https://googleusercontent.com/image_generation_content/4" alt="The Tavern">
                    <h3 class="text-uppercase" data-fsc-item-path="the-tavern" data-fsc-item-display>The Tavern</h3>
                    <div class="h4 mb-3 text-primary" data-fsc-item-path="the-tavern" data-fsc-item-price>$10.00</div>
                    <button type="button" onclick="event.stopPropagation(); addToCart('the-tavern')" class="btn btn-dark w-100">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card h-100" onclick="openQuickView('hall-of-legends', 'Hall of Legends', 'Choose from our curated vault of high-level heroes. These characters come with complex backstories and magic items.', 'https://googleusercontent.com/image_generation_content/6')">
                    <img src="https://googleusercontent.com/image_generation_content/6" alt="Hall of Legends">
                    <h3 class="text-uppercase" data-fsc-item-path="hall-of-legends" data-fsc-item-display>Hall of Legends</h3>
                    <div class="h4 mb-3 text-primary" data-fsc-item-path="hall-of-legends" data-fsc-item-price>$25.00</div>
                    <button type="button" onclick="event.stopPropagation(); addToCart('hall-of-legends')" class="btn btn-dark w-100">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card h-100" onclick="openQuickView('great-architect', 'The Architect', 'A completely bespoke character commission. We build the stats, the lore, and a custom character portrait from scratch.', 'https://googleusercontent.com/image_generation_content/9')">
                    <img src="https://googleusercontent.com/image_generation_content/9" alt="Great Architect">
                    <h3 class="text-uppercase" data-fsc-item-path="great-architect" data-fsc-item-display>The Architect</h3>
                    <div class="h4 mb-3 text-primary" data-fsc-item-path="great-architect" data-fsc-item-price>$50.00</div>
                    <button type="button" onclick="event.stopPropagation(); addToCart('great-architect')" class="btn btn-dark w-100">Add to Cart</button>
                </div>
            </div>

        </div>
    </section>

    <div class="modal fade" id="quickViewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body text-center"><img id="modalImage" src="" class="img-fluid"><p id="modalDescription" class="mt-3"></p></div>
                <div class="modal-footer"><button id="modalBuyBtn" class="btn btn-dark w-100">Add to Cart</button></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <script type="text/javascript">
        // 1. CLICK HANDLER
        function addToCart(path) {
            console.log("Ready to Roll: Adding " + path);
            fastspring.builder.add(path);
            const container = document.getElementById('fsc-embedded-checkout-container');
            container.style.display = 'block';
            fastspring.builder.checkout();
            setTimeout(() => { container.scrollIntoView({ behavior: 'smooth' }); }, 300);
        }

        // 2. QUICK VIEW MODAL (Using hardcoded fallbacks to be safe)
        function openQuickView(path, name, desc, img) {
            const modal = new bootstrap.Modal(document.getElementById('quickViewModal'));
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalImage').src = img;
            document.getElementById('modalDescription').innerText = desc;
            document.getElementById('modalBuyBtn').onclick = function() {
                modal.hide();
                addToCart(path);
            };
            modal.show();
        }

        function onFscOrderItemsChanged(data) { console.log("Cart Sync:", data); }
        window.fastspring = { builder: { "onOrderItemsChanged": onFscOrderItemsChanged } };
    </script>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
