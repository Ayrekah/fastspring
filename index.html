<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple FastSpring Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>FastSpring Embedded Example</h1>

 <div class="product" data-product="the-tavern">
  <span class="name">The Tavern</span>
  <button class="decrease">–</button>
  <span class="quantity">0</span>
  <button class="increase">+</button>
</div>

<div class="product" data-product="the-campfire">
  <span class="name">The Campfire</span>
  <button class="decrease">–</button>
  <span class="quantity">0</span>
  <button class="increase">+</button>
</div>

<div class="product" data-product="the-guild-hall">
  <span class="name">The Guild Hall</span>
  <button class="decrease">–</button>
  <span class="quantity">0</span>
  <button class="increase">+</button>
</div>

  <!-- FastSpring Embedded Checkout Container -->
  <div id="fsc-embedded-checkout-container"></div>

  <!-- FastSpring Script -->
  <script
    id="fsc-api"
    src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
    type="text/javascript"
    data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
  </script>

  <script src="script.js"></script>
</body>
</html>
