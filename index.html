<!DOCTYPE html>
<html>
<head>
    <title>Character Smithy | TTRPG Solutions</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-before-requests-callback="onFscReady">
    </script>

    <style>
        #fsc-embedded-checkout-container {
            display: none;
            margin: 50px auto;
            max-width: 1000px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            min-height: 400px; /* Gives the container space to breathe */
        }
        .static-hero {
            background-color: #f3f5f7;
            padding: 100px 0;
        }
        /* Fix to make sure buttons are clickable over the card hover effects */
        .cart-button {
            z-index: 10;
            position: relative;
        }
    </style>
</head>

<body data-bs-spy="scroll" data-bs-target="#navbar">

    <header id="header" class="site-header header-scrolled position-fixed text-black bg-light">
        <nav id="header-nav" class="navbar navbar-expand-lg px-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="images/main-logo.png" class="logo">
                </a>
            </div>
        </nav>
    </header>

    <section id="billboard" class="static-hero position-relative overflow-hidden">
        <div class="container">
            <div class="row d-flex align-items-center">
                <div class="col-md-6">
                    <div class="banner-content">
                        <h1 class="display-2 text-uppercase text-dark pb-5">Level Up Your Lore.</h1>
                        <a href="#ttrpg-products" class="btn btn-medium btn-dark text-uppercase btn-rounded-none">Browse Character Tiers</a>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="image-holder">
                        <img src="https://googleusercontent.com/image_generation_content/5" alt="Hero" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="ttrpg-products" class="product-store position-relative padding-large">
        <div class="container">
            <div class="row">
                <div class="display-header d-flex justify-content-between pb-3">
                    <h2 class="display-7 text-dark text-uppercase">Character Packages</h2>
                </div>
                
                <div class="row">
                    
                    <div class="col-md-4">
                        <div class="product-card position-relative">
                            <div class="image-holder">
                                <img data-fsc-item-path="the-tavern" data-fsc-item-image src="" alt="The Tavern" class="img-fluid">
                            </div>
                            <div class="cart-concern position-absolute">
                                <div class="cart-button d-flex">
                                    <button data-fsc-item-path-value="the-tavern" data-fsc-action="Add" class="btn btn-medium btn-black border-0">
                                        Add to Cart <svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                                <h3 class="card-title text-uppercase">
                                    <a href="#" data-fsc-item-path="the-tavern" data-fsc-item-display></a>
                                </h3>
                                <span class="item-price text-primary" data-fsc-item-path="the-tavern" data-fsc-item-price></span>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="product-card position-relative">
                            <div class="image-holder">
                                <img data-fsc-item-path="hall-of-legends" data-fsc-item-image src="" alt="Hall of Legends" class="img-fluid">
                            </div>
                            <div class="cart-concern position-absolute">
                                <div class="cart-button d-flex">
                                    <button data-fsc-item-path-value="hall-of-legends" data-fsc-action="Add" class="btn btn-medium btn-black border-0">
                                        Add to Cart <svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                                <h3 class="card-title text-uppercase">
                                    <a href="#" data-fsc-item-path="hall-of-legends" data-fsc-item-display></a>
                                </h3>
                                <span class="item-price text-primary" data-fsc-item-path="hall-of-legends" data-fsc-item-price></span>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="product-card position-relative">
                            <div class="image-holder">
                                <img data-fsc-item-path="great-architect" data-fsc-item-image src="" alt="Great Architect" class="img-fluid">
                            </div>
                            <div class="cart-concern position-absolute">
                                <div class="cart-button d-flex">
                                    <button data-fsc-item-path-value="great-architect" data-fsc-action="Add" class="btn btn-medium btn-black border-0">
                                        Add to Cart <svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                                <h3 class="card-title text-uppercase">
                                    <a href="#" data-fsc-item-path="great-architect" data-fsc-item-display></a>
                                </h3>
                                <span class="item-price text-primary" data-fsc-item-path="great-architect" data-fsc-item-price></span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <div id="fsc-embedded-checkout-container"></div>

    <footer id="footer" class="padding-large">
        <div class="container text-center">
            <p>© 2026 Character Smithy Demo Store. Distributed by ThemeWagon.</p>
        </div>
    </footer>
