<!DOCTYPE html>
<html lang="en">

<head>
<title>Ready to Roll | FastSpring Demo</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">

<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
type="text/javascript"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
data-debug="true">
</script>

</head>

<body>

<header class="p-3 border-bottom sticky-top bg-white">
<div class="container d-flex justify-content-between align-items-center">
<strong>READY TO ROLL</strong>
<div>
Cart: <span id="cart-count">0</span> items | 
Total: <strong data-fsc-order-total></strong>
</div>
</div>
</header>

<section class="container py-5">

<div class="row g-4">

<!-- PRODUCT 1 -->
<div class="col-md-4">
<div class="product-card border rounded p-3 h-100 text-center">

<img
data-fsc-item-path="the-tavern"
data-fsc-item-image
class="img-fluid rounded"
onclick="openFullDetails('the-tavern')">

<h3
class="mt-3"
data-fsc-item-path="the-tavern"
data-fsc-item-display>
</h3>

<p
class="text-muted"
data-fsc-item-path="the-tavern"
data-fsc-item-description-summary>
</p>

<div
class="h4 text-primary"
data-fsc-item-path="the-tavern"
data-fsc-item-price>
</div>

<button
class="btn btn-dark w-100 mt-2"
data-fsc-action="Add"
data-fsc-item-path-value="the-tavern">
Add to Cart
</button>

<button
class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-tavern')">
View Details
</button>

</div>
</div>

<!-- PRODUCT 2 -->
<div class="col-md-4">
<div class="product-card border rounded p-3 h-100 text-center">

<img
data-fsc-item-path="the-campfire"
data-fsc-item-image
class="img-fluid rounded"
onclick="openFullDetails('the-campfire')">

<h3
class="mt-3"
data-fsc-item-path="the-campfire"
data-fsc-item-display>
</h3>

<p
class="text-muted"
data-fsc-item-path="the-campfire"
data-fsc-item-description-summary>
</p>

<div
class="h4 text-primary"
data-fsc-item-path="the-campfire"
data-fsc-item-price>
</div>

<button
class="btn btn-dark w-100 mt-2"
data-fsc-action="Add"
data-fsc-item-path-value="the-campfire">
Add to Cart
</button>

<button
class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-campfire')">
View Details
</button>

</div>
</div>

<!-- PRODUCT 3 -->
<div class="col-md-4">
<div class="product-card border rounded p-3 h-100 text-center">

<img
data-fsc-item-path="the-guild-hall"
data-fsc-item-image
class="img-fluid rounded"
onclick="openFullDetails('the-guild-hall')">

<h3
class="mt-3"
data-fsc-item-path="the-guild-hall"
data-fsc-item-display>
</h3>

<p
class="text-muted"
data-fsc-item-path="the-guild-hall"
data-fsc-item-description-summary>
</p>

<div
class="h4 text-primary"

data-fsc-item-price>
</div>

<button
class="btn btn-dark w-100 mt-2"
data-fsc-action="Add"
data-fsc-item-path-value="the-guild-hall">
Add to Cart
</button>

<button
class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-guild-hall')">
View Details
</button>

</div>
</div>

</div>

</section>

<!-- CART -->

<section class="container py-5">

<h3>Your Cart</h3>

<div data-fsc-order-items>

<div
class="d-flex justify-content-between align-items-center border-bottom py-2"
data-fsc-item>

<div>

<strong data-fsc-item-display></strong><br>

<span data-fsc-item-price></span>

</div>

<button
class="btn btn-sm btn-outline-danger"
data-fsc-action="Remove">
Remove
</button>

</div>

</div>

<div class="mt-3">

Total:
<strong data-fsc-order-total></strong>

</div>

<button
class="btn btn-success mt-3"
data-fsc-action="Checkout">
Checkout
</button>

</section>

<!-- EMBEDDED CHECKOUT -->

<section class="container py-5">

<h3>Checkout</h3>

<div
id="fsc-embedded-checkout-container"
style="display:none;">
</div>

</section>

<!-- PRODUCT DETAIL MODAL -->

<div class="modal fade" id="detailModal" tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title" id="modalTitle"></h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<div id="modalDescription"></div>

</div>

</div>

</div>

</div>

<!-- JS -->

<script src="js/bootstrap.bundle.min.js"></script>

<script>

function onFscOrderItemsChanged(data){

console.log("Order updated:", data);

const checkout = document.getElementById("fsc-embedded-checkout-container");

if(data.items.length > 0){

checkout.style.display = "block";

fastspring.builder.checkout();

}

}

window.fastspring = {
builder:{
onOrderItemsChanged:onFscOrderItemsChanged
}
}

function openFullDetails(path){

const item = fastspring.builder.item(path);

if(!item){

console.warn("Item not loaded yet");

return;

}

document.getElementById("modalTitle").innerText = item.display;

document.getElementById("modalDescription").innerHTML = item.descriptionFull;

const modal = new bootstrap.Modal(document.getElementById("detailModal"));

modal.show();

}

</script>

</body>
</html>
