<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fantasy Shop</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#020617;
}

.cart{
background:#6366f1;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
padding:40px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
margin-bottom:12px;
}

.price{
margin-top:8px;
font-weight:bold;
}

button{
background:#6366f1;
border:none;
color:white;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#4f46e5;
}

.summary{
font-size:14px;
opacity:.85;
margin-top:8px;
}

</style>
</head>

<body>

<header>

<h2>Fantasy Marketplace</h2>

<div class="cart" data-fsc-action="ViewCart">
Cart (<span data-fsc-order-item-count></span>)
</div>

</header>


<div class="products">

<!-- Tavern -->

<div class="card">

<img data-fsc-item-path="the-tavern" data-fsc-item-image />

<h3>
<span data-fsc-item-path="the-tavern" data-fsc-item-display></span>
</h3>

<div class="summary">
<span data-fsc-item-path="the-tavern" data-fsc-item-description-summary></span>
</div>

<div class="price">
<span data-fsc-item-path="the-tavern" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-tavern">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="the-tavern">
View Details
</button>

</div>


<!-- Campfire -->

<div class="card">

<img data-fsc-item-path="the-campfire" data-fsc-item-image />

<h3>
<span data-fsc-item-path="the-campfire" data-fsc-item-display></span>
</h3>

<div class="summary">
<span data-fsc-item-path="the-campfire" data-fsc-item-description-summary></span>
</div>

<div class="price">
<span data-fsc-item-path="the-campfire" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-campfire">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="the-campfire">
View Details
</button>

</div>


<!-- Guild Hall -->

<div class="card">

<img data-fsc-item-path="the-guild-hall" data-fsc-item-image />

<h3>
<span data-fsc-item-path="the-guild-hall" data-fsc-item-display></span>
</h3>

<div class="summary">
<span data-fsc-item-path="the-guild-hall" data-fsc-item-description-summary></span>
</div>

<div class="price">
<span data-fsc-item-path="the-guild-hall" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-guild-hall">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="the-guild-hall">
View Details
</button>

</div>

</div>



<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.3/fastspring-builder.min.js"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
type="text/javascript">
</script>

</body>
</html>
