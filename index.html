<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ready To Roll Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Ready To Roll</h1>

    <div class="product-card">
        <span data-fsc-item-path="the-tavern" data-fsc-item-display></span>
        <span data-fsc-item-path="the-tavern" data-fsc-item-price></span>
        <button data-fsc-item-path-value="the-tavern" data-fsc-action="Add">Add</button>
    </div>

    <div class="product-card">
        <span data-fsc-item-path="the-campfire" data-fsc-item-display></span>
        <span data-fsc-item-path="the-campfire" data-fsc-item-price></span>
        <button data-fsc-item-path-value="the-campfire" data-fsc-action="Add">Add</button>
    </div>

    <div class="product-card">
        <span data-fsc-item-path="the-guild-hall" data-fsc-item-display></span>
        <span data-fsc-item-path="the-guild-hall" data-fsc-item-price></span>
        <button data-fsc-item-path-value="the-guild-hall" data-fsc-action="Add">Add</button>
    </div>

    <hr />

    <div data-fsc-items-container>
        <h3>Your Selection</h3>
        
        <div data-fsc-item-path="the-tavern">
            <span data-fsc-item-display></span>
            <span data-fsc-item-quantity></span>
            <span data-fsc-item-total></span>
            <button data-fsc-item-path-value="the-tavern" data-fsc-action="Remove">Remove</button>
        </div>

        <div data-fsc-item-path="the-campfire">
            <span data-fsc-item-display></span>
            <span data-fsc-item-quantity></span>
            <span data-fsc-item-total></span>
            <button data-fsc-item-path-value="the-campfire" data-fsc-action="Remove">Remove</button>
        </div>

        <div data-fsc-item-path="the-guild-hall">
            <span data-fsc-item-display></span>
            <span data-fsc-item-quantity></span>
            <span data-fsc-item-total></span>
            <button data-fsc-item-path-value="the-guild-hall" data-fsc-action="Remove">Remove</button>
        </div>
    </div>

    <hr />

    <div>
        Total: <span data-fsc-order-totalWithTax></span>
    </div>
    <button data-fsc-action="Reset">Clear All</button>

    <div id="fsc-embedded-checkout-container"></div>

    <script
        id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
    </script>
    
    <script src="script.js"></script>
</body>
</html>
