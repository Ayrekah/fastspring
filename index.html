<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Store</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        .product-card { border: 1px solid #eee; padding: 25px; transition: 0.3s; background: #fff; text-align: center; }
        #fsc-embedded-checkout-container { display: none; min-height: 600px; margin-top: 20px; border-top: 2px solid #000; padding-top: 20px; }
        
        /* THE CART LIST STYLING */
        #cart-summary { display: none; border: 2px solid #333; padding: 20px; margin-top: 40px; background: #fff; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .qty-box { width: 60px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>

<body>
    <header class="p-3 border-bottom sticky-top bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <strong>READY TO ROLL</strong>
            <div>Total: <span class="fw-bold" data-fsc-order-total>$0.00</span></div>
        </div>
    </header>

    <section class="container py-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-tavern" data-fsc-item-image src="" class="img-fluid mb-2">
                    <h4 data-fsc-item-path="the-tavern" data-fsc-item-display>The Tavern</h4>
                    <div class="h5 text-primary" data-fsc-item-path="the-tavern" data-fsc-item-price></div>
                    
                    <button class="btn btn-dark w-100" onclick="fastspring.builder.add('the-tavern')">Add to Cart</button>
                    <button class="btn btn-link btn-sm text-dark mt-2" data-bs-toggle="modal" data-bs-target="#modal-tavern">View Full Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-campfire" data-fsc-item-image src="" class="img-fluid mb-2">
                    <h4 data-fsc-item-path="the-campfire" data-fsc-item-display>The Campfire</h4>
                    <div class="h5 text-primary" data-fsc-item-path="the-campfire" data-fsc-item-price></div>
                    <button class="btn btn-dark w-100" onclick="fastspring.builder.add('the-campfire')">Add to Cart</button>
                    <button class="btn btn-link btn-sm text-dark mt-2" data-bs-toggle="modal" data-bs-target="#modal-campfire">View Full Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-guild-hall" data-fsc-item-image src="" class="img-fluid mb-2">
                    <h4 data-fsc-item-path="the-guild-hall" data-fsc-item-display>The Guild Hall</h4>
                    <div class="h5 text-primary" data-fsc-item-path="the-guild-hall" data-fsc-item-price></div>
                    <button class="btn btn-dark w-100" onclick="fastspring.builder.add('the-guild-hall')">Add to Cart</button>
                    <button class="btn btn-link btn-sm text-dark mt-2" data-bs-toggle="modal" data-bs-target="#modal-guild">View Full Details</button>
                </div>
            </div>

        </div>
    </section>

    <div id="cart-summary" class="container">
        <h3 class="text-uppercase mb-3">Your Party</h3>
        <div data-fsc-items-container>
            <div class="cart-row">
                <div class="d-flex align-items-center">
                    <span data-fsc-item-display class="fw-bold me-3"></span>
                    <input type="number" class="qty-box" data-fsc-item-quantity-value data-fsc-autoapply min="1">
                </div>
                <div>
                    <span data-fsc-item-total class="me-3"></span>
                    <button class="btn btn-sm btn-link text-danger" data-fsc-item-path-value data-fsc-action="Remove">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <div class="modal fade" id="modal-tavern" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" data-fsc-item-path="the-tavern">
                <div class="modal-header">
                    <h5 class="modal-title" data-fsc-item-display></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img data-fsc-item-image src="" class="img-fluid mb-3">
                    <div data-fsc-item-description-full></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-campfire" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" data-fsc-item-path="the-campfire">
                <div class="modal-header">
                    <h5 class="modal-title" data-fsc-item-display></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img data-fsc-item-image src="" class="img-fluid mb-3">
                    <div data-fsc-item-description-full></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-guild" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" data-fsc-item-path="the-guild-hall">
                <div class="modal-header">
                    <h5 class="modal-title" data-fsc-item-display></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img data-fsc-item-image src="" class="img-fluid mb-3">
                    <div data-fsc-item-description-full></div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        /**
         * The SBL Handshake: Toggles the visibility of the cart list and checkout
         */
        function onFscOrderItemsChanged(data) {
            const summary = document.getElementById('cart-summary');
            const checkout = document.getElementById('fsc-embedded-checkout-container');

            if (data && data.items && data.items.length > 0) {
                summary.style.display = 'block';
                checkout.style.display = 'block';
                fastspring.builder.checkout();
            } else {
                summary.style.display = 'none';
                checkout.style.display = 'none';
            }
        }

        window.fastspring = {
            builder: { "onOrderItemsChanged": onFscOrderItemsChanged }
        };
    </script>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
