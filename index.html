<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>Ready to Roll</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#0f172a;
color:white;
}

.hero{
padding:80px 20px;
text-align:center;
background:#020617;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
padding:50px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
border-radius:6px;
margin-bottom:10px;
}

button{
background:#6366f1;
border:none;
color:white;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

.checkout{
padding:40px;
background:#020617;
}

</style>

<!-- FASTSPRING SCRIPT -->
<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
type="text/javascript"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
</script>

</head>

<body>

<section class="hero">
<h1>Ready to Roll</h1>
<p>Adventure tools for your tabletop campaigns</p>
</section>


<section class="products">

<!-- Tavern -->
<div class="card">

<img data-fsc-item-path="the-tavern" data-fsc-item-image>

<h3>
<span data-fsc-item-path="the-tavern" data-fsc-item-display></span>
</h3>

<p>
<span data-fsc-item-path="the-tavern" data-fsc-item-description-summary></span>
</p>

<div>
<span data-fsc-item-path="the-tavern" data-fsc-item-price></span>
</div>

<button
data-fsc-item-path-value="the-tavern"
data-fsc-action="Add">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="the-tavern">
View Details
</button>

</div>


<!-- Campfire -->
<div class="card">

<img data-fsc-item-path="the-campfire" data-fsc-item-image>

<h3>
<span data-fsc-item-path="the-campfire" data-fsc-item-display></span>
</h3>

<p>
<span data-fsc-item-path="the-campfire" data-fsc-item-description-summary></span>
</p>

<div>
<span data-fsc-item-path="the-campfire" data-fsc-item-price></span>
</div>

<button
data-fsc-item-path-value="the-campfire"
data-fsc-action="Add">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="the-campfire">
View Details
</button>

</div>


<!-- Guild Hall -->
<div class="card">

<img data-fsc-item-path="the-guild-hall" data-fsc-item-image>

<h3>
<span data-fsc-item-path="the-guild-hall" data-fsc-item-display></span>
</h3>

<p>
<span data-fsc-item-path="the-guild-hall" data-fsc-item-description-summary></span>
</p>

<div>
<span data-fsc-item-path="the-guild-hall" data-fsc-item-price></span>
</div>

<button
data-fsc-item-path-value="the-guild-hall"
data-fsc-action="Add">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="the-guild-hall">
View Details
</button>

</div>

</section>


<section class="checkout">

<h2>Checkout</h2>

<div id="fsc-embedded-checkout-container"></div>

</section>

</body>
</html>
