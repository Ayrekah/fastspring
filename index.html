<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ready To Roll</title>
<link rel="stylesheet" href="style.css">

<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
type="text/javascript"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
</script>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Uncial+Antiqua&display=swap" rel="stylesheet">

</head>

<body>

<header class="site-header">
  <div class="container">

    <div class="logo-area">
      <img src="images/d20.png" class="logo">
      <h1 class="site-title">Ready To Roll</h1>
    </div>

  </div>
</header>

	
	<!-- Fast Spring Products -->

	<section class="products">
  <div class="container">

    <div class="product-grid">

      <!-- CAMPFIRE -->
      <div class="product-box">

        <img class="product-image"
             data-fsc-item-path="the-campfire"
             data-fsc-item-image
             alt="The Campfire">

        <h2 class="product-title"
            data-fsc-item-path="the-campfire"
            data-fsc-item-display></h2>
		  	<details class="product-full-description">
  <summary>Full Description</summary>

  <div class="description-content">
    <span data-fsc-item-path="the-campfire"
          data-fsc-item-description-full></span>
  </div>
</details>

     <p class="product-description"
   data-fsc-item-path="the-campfire"
   data-fsc-item-description-summary></p>

        <div class="product-controls">

          <select class="qty-select"
            data-fsc-item-path-value="the-campfire"
            data-fsc-item-quantity-value>

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>

          </select>

          <button class="add-btn"
            data-fsc-item-path-value="the-campfire"
            data-fsc-action="Update">
            Add to Cart
          </button>

		


        </div>

      </div>


      <!-- TAVERN -->
      <div class="product-box">

        <img class="product-image"
             data-fsc-item-path="the-tavern"
             data-fsc-item-image
             alt="The Tavern">

        <h2 class="product-title"
            data-fsc-item-path="the-tavern"
            data-fsc-item-display></h2>
		  <details class="product-full-description">
  <summary>Full Description</summary>

  <div class="description-content">
    <span data-fsc-item-path="the-tavern"
          data-fsc-item-description-full></span>
  </div>
</details>

        <p class="product-description"
           data-fsc-item-path="the-tavern"
           data-fsc-item-description-summary></p>

        <div class="product-controls">

          <select class="qty-select"
            data-fsc-item-path-value="the-tavern"
            data-fsc-item-quantity-value>

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>

          </select>

          <button class="add-btn"
            data-fsc-item-path-value="the-tavern"
            data-fsc-action="Update">
            Add to Cart
          </button>

			


        </div>

      </div>


      <!-- GUILD HALL -->
      <div class="product-box">

        <img class="product-image"
             data-fsc-item-path="the-guild-hall"
             data-fsc-item-image
             alt="The Guild Hall">

        <h2 class="product-title"
            data-fsc-item-path="the-guild-hall"
            data-fsc-item-display></h2>
	<details class="product-full-description">
  <summary>Full Description</summary>

  <div class="description-content">
    <span data-fsc-item-path="the-guild-hall"
          data-fsc-item-description-full></span>
  </div>
</details>
        <p class="product-description"
           data-fsc-item-path="the-guild-hall"
           data-fsc-item-description-summary></p>

        <div class="product-controls">

          <select class="qty-select"
            data-fsc-item-path-value="the-guild-hall"
            data-fsc-item-quantity-value>

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>

          </select>

          <button class="add-btn"
            data-fsc-item-path-value="the-guild-hall"
            data-fsc-action="Update">
            Add to Cart
          </button>


        </div>

      </div>

    </div>

  </div>
</section>

<section class="cart">
  <div class="container">

    <h2 data-fsc-selections-smartdisplay data-fsc-filter="selected=true">
      Your Cart (<span data-fsc-order-item-count></span>)
    </h2>

    <div data-fsc-selections-smartdisplay data-fsc-filter="selected=false">
      <p>Your cart is empty.</p>
    </div>

    <div
      data-fsc-selections-smartdisplay
      data-fsc-items-container="shopping-cart"
      data-fsc-filter="selected=true">
    </div>

    <div class="cart-summary" data-fsc-selections-smartdisplay data-fsc-filter="selected=true">

     <div data-fsc-selections-smartdisplay data-fsc-filter="selected=true">

<p>
Subtotal:
<strong>
<span data-fsc-order-subtotal></span>
</strong>
</p>

</div>

      <button data-fsc-action="Checkout">
        Checkout
      </button>

      <button data-fsc-action="Reset">
        Clear Cart
      </button>

    </div>

  </div>
</section>
<script data-fsc-template-for="shopping-cart" type="text/x-handlebars-template">

<ul class="cart-items">

{{#each items}}
  {{#each items}}

  <li class="cart-item">

    <span class="cart-name">
      {{this.display}}
    </span>

    <span class="cart-qty">
      Qty: {{this.quantity}}
    </span>

   <span class="cart-price">
  {{this.total}}
</span>

    <button
      data-fsc-item-path-value="{{this.path}}"
      data-fsc-action="Remove">
      ❌
    </button>

  </li>

  {{/each}}
{{/each}}

</ul>

</script>
<div id="fsc-embedded-checkout-container"></div>


<script src="script.js"></script>

</body>
</html>
