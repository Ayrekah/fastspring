<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guild Marketplace</title>

<style>

body{
font-family: Arial, sans-serif;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#020617;
}

.cart-button{
background:#6366f1;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
padding:40px;
}

.card{
background:#1e293b;
border-radius:12px;
padding:20px;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
margin-bottom:10px;
}

button{
background:#6366f1;
border:none;
color:white;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#4f46e5;
}

.details{
margin-top:10px;
font-size:14px;
opacity:.8;
}

</style>
</head>

<body>

<header>

<h2>Guild Marketplace</h2>

<div class="cart-button" data-fsc-action="ViewCart">
Cart (<span data-fsc-order-item-count></span>)
</div>

</header>


<div class="products">


<!-- Guild Hall -->

<div class="card">

<img src="images/guildhall.jpg">

<h3>
<span data-fsc-item-path="guildhall" data-fsc-item-display></span>
</h3>

<div class="details">
<span data-fsc-item-path="guildhall" data-fsc-item-description-summary></span>
</div>

<div>
Price: <span data-fsc-item-path="guildhall" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="guildhall">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="guildhall">
View Details
</button>

</div>



<!-- Magic Sword -->

<div class="card">

<img src="images/sword.jpg">

<h3>
<span data-fsc-item-path="sword" data-fsc-item-display></span>
</h3>

<div class="details">
<span data-fsc-item-path="sword" data-fsc-item-description-summary></span>
</div>

<div>
Price: <span data-fsc-item-path="sword" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="sword">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="sword">
View Details
</button>

</div>



<!-- Potion -->

<div class="card">

<img src="images/potion.jpg">

<h3>
<span data-fsc-item-path="potion" data-fsc-item-display></span>
</h3>

<div class="details">
<span data-fsc-item-path="potion" data-fsc-item-description-summary></span>
</div>

<div>
Price: <span data-fsc-item-path="potion" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="potion">
Add to Cart
</button>

<button
data-fsc-action="View"
data-fsc-item-path-value="potion">
View Details
</button>

</div>


</div>



<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.3/fastspring-builder.min.js"
data-storefront="yourstore.onfastspring.com/popup-yourstore"
type="text/javascript">
</script>


</body>
</html>
