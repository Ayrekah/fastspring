<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ready To Roll</title>
<link rel="stylesheet" href="style.css">

<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
type="text/javascript"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
</script>

</head>
<body>
	<header id="header" class="site-header header-scrolled position-fixed text-black bg-light">
        <div class="container-fluid">
          <a class="navbar-brand">
           <h1>Ready To Roll</h1> <img src="images/d20.jpg" class="logo">
          </a>
        </div>
    </header>

	<!-- Template Products -->

	<section id="mobile-products" class="product-store position-relative padding-large no-padding-top">
      <div class="container">
        <div class="row">
          <div class="display-header d-flex justify-content-between pb-3">
            <h2 class="display-7 text-dark text-uppercase">Mobile Products</h2>
            <div class="btn-right">
              <a href="shop.html" class="btn btn-medium btn-normal text-uppercase">Go to Shop</a>
            </div>
          </div>
          <div class="swiper product-swiper swiper-initialized swiper-horizontal swiper-backface-hidden">
            <div class="swiper-wrapper" id="swiper-wrapper-51bd6d684d7cf7af" aria-live="polite">
              <div class="swiper-slide swiper-slide-active" role="group" aria-label="1 / 5" style="width: 315px; margin-right: 20px;">
                <div class="product-card position-relative">
                  <div class="image-holder">
                    <img src="images/product-item1.jpg" alt="product-item" class="img-fluid">
                  </div>
                  <div class="cart-concern position-absolute">
                    <div class="cart-button d-flex">
                      <a href="#" class="btn btn-medium btn-black">Add to Cart<svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg></a>
                    </div>
                  </div>
                  <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                    <h3 class="card-title text-uppercase">
                      <a href="#">Iphone 10</a>
                    </h3>
                    <span class="item-price text-primary">$980</span>
                  </div>
                </div>
              </div>
              <div class="swiper-slide swiper-slide-next" role="group" aria-label="2 / 5" style="width: 315px; margin-right: 20px;">
                <div class="product-card position-relative">
                  <div class="image-holder">
                    <img src="images/product-item2.jpg" alt="product-item" class="img-fluid">
                  </div>
                  <div class="cart-concern position-absolute">
                    <div class="cart-button d-flex">
                      <a href="#" class="btn btn-medium btn-black">Add to Cart<svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg></a>
                    </div>
                  </div>
                  <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                    <h3 class="card-title text-uppercase">
                      <a href="#">Iphone 11</a>
                    </h3>
                    <span class="item-price text-primary">$1100</span>
                  </div>
                </div>
              </div>
              <div class="swiper-slide" role="group" aria-label="3 / 5" style="width: 315px; margin-right: 20px;">
                <div class="product-card position-relative">
                  <div class="image-holder">
                    <img src="images/product-item3.jpg" alt="product-item" class="img-fluid">
                  </div>
                  <div class="cart-concern position-absolute">
                    <div class="cart-button d-flex">
                      <a href="#" class="btn btn-medium btn-black">Add to Cart<svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg></a>
                    </div>
                  </div>
                  <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                    <h3 class="card-title text-uppercase">
                      <a href="#">Iphone 8</a>
                    </h3>
                    <span class="item-price text-primary">$780</span>
                  </div>
                </div>
              </div>
              <div class="swiper-slide" role="group" aria-label="4 / 5" style="width: 315px; margin-right: 20px;">
                <div class="product-card position-relative">
                  <div class="image-holder">
                    <img src="images/product-item4.jpg" alt="product-item" class="img-fluid">
                  </div>
                  <div class="cart-concern position-absolute">
                    <div class="cart-button d-flex">
                      <a href="#" class="btn btn-medium btn-black">Add to Cart<svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg></a>
                    </div>
                  </div>
                  <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                    <h3 class="card-title text-uppercase">
                      <a href="#">Iphone 13</a>
                    </h3>
                    <span class="item-price text-primary">$1500</span>
                  </div>
                </div>
              </div>
              <div class="swiper-slide" role="group" aria-label="5 / 5" style="width: 315px; margin-right: 20px;">
                <div class="product-card position-relative">
                  <div class="image-holder">
                    <img src="images/product-item5.jpg" alt="product-item" class="img-fluid">
                  </div>
                  <div class="cart-concern position-absolute">
                    <div class="cart-button d-flex">
                      <a href="#" class="btn btn-medium btn-black">Add to Cart<svg class="cart-outline"><use xlink:href="#cart-outline"></use></svg></a>
                    </div>
                  </div>
                  <div class="card-detail d-flex justify-content-between align-items-baseline pt-3">
                    <h3 class="card-title text-uppercase">
                      <a href="#">Iphone 12</a>
                    </h3>
                    <span class="item-price text-primary">$1300</span>
                  </div>
                </div>
              </div>
            </div>
          <span class="swiper-notification" aria-live="assertive" aria-atomic="true"></span></div>
        </div>
      </div>
      <div class="swiper-pagination position-absolute text-center swiper-pagination-clickable swiper-pagination-bullets swiper-pagination-horizontal"><span class="swiper-pagination-bullet swiper-pagination-bullet-active" tabindex="0" role="button" aria-label="Go to slide 1" aria-current="true"></span><span class="swiper-pagination-bullet" tabindex="0" role="button" aria-label="Go to slide 2"></span></div>
    </section>

	<!-- Fast Spring Code -->

<div class="product">

  <h2 data-fsc-item-path="the-tavern" data-fsc-item-display></h2>

  <img data-fsc-item-path="the-tavern" data-fsc-item-image alt="Product image">

  <p data-fsc-item-path="the-tavern" data-fsc-item-description-summary></p>

<select  data-fsc-item-path-value="the-tavern" data-fsc-item-quantity-value>
	<option value="1">1</option>
	<option value="2">2</option>
	<option value="3">3</option>
	<option value="4">4</option>
	<option value="5">5</option>
</select>
<!-- Then Use fsc-action="Update" to update cart in button -->
<button data-fsc-item-path-value="the-tavern" data-fsc-action="Update">Update</button>

<!-- 
	DEMO RESULTS
-->
<br /><br />
Quantity: 
<span data-fsc-item-path="the-tavern" data-fsc-item-quantity>
	<!--This value will be replaced-->
</span>

  <button data-fsc-item-path="the-tavern" data-fsc-item-description-action></button>

</div>
	

<div id="fsc-embedded-checkout-container"></div>

<script src="script.js"></script>

</body>
</html>
