<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple FastSpring Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>FastSpring Embedded Checkout Example</h1>

  <div class="products">
    <button class="buy-button" data-product="the-tavern">Buy The Tavern</button>
    <button class="buy-button" data-product="the-campfire">Buy The Campfire</button>
    <button class="buy-button" data-product="the-guild-hall">Buy The Guild Hall</button>
  </div>

  <!-- FastSpring Embedded Checkout Container -->
  <div id="fsc-embedded-checkout-container"></div>

  <!-- FastSpring Script -->
  <script
    id="fsc-api"
    src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
    type="text/javascript"
    data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
  </script>

  <script src="script.js"></script>
</body>
</html>
