<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ready to Roll Store</title>

<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
type="text/javascript"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
data-debug="true">
</script>

</head>

<body>

<h1>Ready to Roll Store</h1>

<h2>Products</h2>

<!-- TAVERN -->
<div>

<img data-fsc-item-path="the-tavern" data-fsc-item-image width="200">

<div>
<strong data-fsc-item-path="the-tavern" data-fsc-item-display></strong>
</div>

<div>
Price: <span data-fsc-item-path="the-tavern" data-fsc-item-price></span>
</div>

<!-- ADD BUTTON -->
<button
data-fsc-action="Add"
data-fsc-item-path-value="the-tavern"
data-fsc-item-selection-smartdisplay="false">
Add to Cart
</button>

<!-- QUANTITY CONTROLS -->
<div
data-fsc-item-path="the-tavern"
data-fsc-item-selection-smartdisplay>

<button onclick="changeQty('the-tavern', -1)">-</button>

<input
type="number"
min="0"
data-fsc-item-path="the-tavern"
data-fsc-item-quantity>

<button onclick="changeQty('the-tavern', 1)">+</button>

</div>

</div>

<hr>

<!-- CAMPFIRE -->
<div>

<img data-fsc-item-path="the-campfire" data-fsc-item-image width="200">

<div>
<strong data-fsc-item-path="the-campfire" data-fsc-item-display></strong>
</div>

<div>
Price: <span data-fsc-item-path="the-campfire" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-campfire"
data-fsc-item-selection-smartdisplay="false">
Add to Cart
</button>

<div
data-fsc-item-path="the-campfire"
data-fsc-item-selection-smartdisplay>

<button onclick="changeQty('the-campfire', -1)">-</button>

<input
type="number"
min="0"
data-fsc-item-path="the-campfire"
data-fsc-item-quantity>

<button onclick="changeQty('the-campfire', 1)">+</button>

</div>

</div>

<hr>

<!-- GUILD HALL -->
<div>

<img data-fsc-item-path="the-guild-hall" data-fsc-item-image width="200">

<div>
<strong data-fsc-item-path="the-guild-hall" data-fsc-item-display></strong>
</div>

<div>
Price: <span data-fsc-item-path="the-guild-hall" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-guild-hall"
data-fsc-item-selection-smartdisplay="false">
Add to Cart
</button>

<div
data-fsc-item-path="the-guild-hall"
data-fsc-item-selection-smartdisplay>

<button onclick="changeQty('the-guild-hall', -1)">-</button>

<input
type="number"
min="0"
data-fsc-item-path="the-guild-hall"
data-fsc-item-quantity>

<button onclick="changeQty('the-guild-hall', 1)">+</button>

</div>

</div>

<hr>

<h2>Cart Summary</h2>

<div>
Subtotal:
<span data-fsc-order-subtotal></span>
</div>

<div>
Tax:
<span data-fsc-order-tax></span>
</div>

<div>
Total:
<span data-fsc-order-total></span>
</div>

<br>

<button data-fsc-action="Checkout">
Checkout
</button>

<button data-fsc-action="Reset">
Clear Cart
</button>

<hr>

<div id="fsc-embedded-checkout-container"></div>

<script>

function changeQty(product, delta) {

const qtyElement = document.querySelector('[data-fsc-item-path="'+product+'"][data-fsc-item-quantity]');
let qty = parseInt(qtyElement.value || qtyElement.textContent || 0);

qty += delta;

if(qty < 0) qty = 0;

window.fastspring.builder.push({
products: [{
path: product,
quantity: qty
}]
});

}

</script>

</body>
</html>
