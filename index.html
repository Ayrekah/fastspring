<!DOCTYPE html>
<html lang="en">

<head>

<title>Ready to Roll</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">

<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
data-continuous="true"
data-debug="true">
</script>

<style>

.product-card{
padding:20px;
border:1px solid #ddd;
border-radius:8px;
text-align:center;
}

.cart-drawer{
position:fixed;
top:0;
right:-380px;
width:380px;
height:100%;
background:white;
box-shadow:-5px 0 20px rgba(0,0,0,.2);
padding:25px;
transition:right .3s;
overflow-y:auto;
z-index:9999;
}

.cart-drawer.open{
right:0;
}

.cart-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
display:none;
z-index:9998;
}

.cart-overlay.show{
display:block;
}

</style>

</head>

<body>

<header class="p-3 border-bottom">

<div class="container d-flex justify-content-between">

<strong>READY TO ROLL-2</strong>

<div onclick="toggleCart()" style="cursor:pointer">
Cart: <span id="cart-count">0</span> |
Total: <span data-fsc-order-total></span>
</div>

</div>

</header>

<section class="container py-5">

<div class="row g-4">

<!-- Tavern -->

<div class="col-md-4">

<div class="product-card" data-fsc-item-path="the-tavern">

<img data-fsc-item-image class="img-fluid">

<h3 data-fsc-item-display></h3>

<p data-fsc-item-description-summary></p>

<div data-fsc-item-price class="h4"></div>

<button
class="btn btn-dark w-100"
data-fsc-action="Add">
Add to Cart
</button>

<button
class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-tavern')">
View Details
</button>

</div>

</div>

<!-- Campfire -->

<div class="col-md-4">

<div class="product-card" data-fsc-item-path="the-campfire">

<img data-fsc-item-image class="img-fluid">

<h3 data-fsc-item-display></h3>

<p data-fsc-item-description-summary></p>

<div data-fsc-item-price class="h4"></div>

<button
class="btn btn-dark w-100"
data-fsc-action="Add">
Add to Cart
</button>

<button
class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-campfire')">
View Details
</button>

</div>

</div>

<!-- Guild Hall -->

<div class="col-md-4">

<div class="product-card" data-fsc-item-path="the-guild-hall">

<img data-fsc-item-image class="img-fluid">

<h3 data-fsc-item-display></h3>

<p data-fsc-item-description-summary></p>

<div data-fsc-item-price class="h4"></div>

<button
class="btn btn-dark w-100"
data-fsc-action="Add">
Add to Cart
</button>

<button
class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-guild-hall')">
View Details
</button>

</div>

</div>

</div>

</section>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

<div class="cart-drawer" id="cartDrawer">

<h4>Your Cart</h4>

<div data-fsc-order>

<div data-fsc-order-items>

<div data-fsc-item data-fsc-item-template
class="d-flex justify-content-between border-bottom py-2">

<div>

<strong data-fsc-item-display></strong><br>

<span data-fsc-item-price></span>

</div>

<button
data-fsc-action="Remove"
class="btn btn-sm btn-outline-danger">
Remove
</button>

</div>

</div>

<div class="mt-3">

Total: <strong data-fsc-order-total></strong>

</div>

<button
data-fsc-action="Checkout"
class="btn btn-success w-100 mt-3">
Checkout
</button>

</div>

<div id="fsc-embedded-checkout-container" class="mt-4"></div>

</div>

<div class="modal fade" id="detailModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 id="modalTitle"></h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body" id="modalDescription"></div>

</div>

</div>

</div>

<script src="js/bootstrap.bundle.min.js"></script>

<script>

function toggleCart(){

document.getElementById("cartDrawer").classList.toggle("open");
document.getElementById("cartOverlay").classList.toggle("show");

}

function onFscOrderItemsChanged(data){

let total=0;

data.items.forEach(item=>{
total+=item.quantity;
});

document.getElementById("cart-count").innerText=total;

if(total>0){

document.getElementById("cartDrawer").classList.add("open");
document.getElementById("cartOverlay").classList.add("show");

fastspring.builder.checkout();

}

}

window.fastspring={
builder:{
onOrderItemsChanged:onFscOrderItemsChanged
}
}

function openFullDetails(path){

const item=fastspring.builder.item(path);

if(!item) return;

document.getElementById("modalTitle").innerText=item.display;

document.getElementById("modalDescription").innerHTML=item.description;

new bootstrap.Modal(document.getElementById("detailModal")).show();

}

</script>

</body>
</html>
