<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | FastSpring SBL Integration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-after-markup-callback="onFscReady"
        data-debug="true">
    </script>

    <style>
        .product-card { padding: 25px; border: 1px solid #eee; height: 100%; transition: 0.3s; background: #fff; }
        .product-card:hover { border-color: #000; transform: translateY(-5px); }
        .product-card img { width: 100%; height: auto; cursor: pointer; background: #f9f9f9; border-radius: 8px; }
        
        /* Quantity Box Styling */
        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .qty-input { width: 60px; text-align: center; border: 1px solid #ddd; border-radius: 4px; }

        #fsc-embedded-checkout-container {
            display: none; 
            margin: 40px auto;
            min-height: 600px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <header class="p-3 border-bottom sticky-top bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <strong class="text-uppercase">Ready to Roll</strong>
            <div class="text-end">
                <div class="small text-muted text-uppercase">Subtotal</div>
                <div class="h5 m-0 fw-bold" data-fsc-order-total></div>
            </div>
        </div>
    </header>

    <section class="container py-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-tavern" data-fsc-item-image src="" onclick="openFullDetails('the-tavern')" class="mb-3">
                    
                    <h3 data-fsc-item-path="the-tavern" data-fsc-item-display></h3>
                    <p class="text-muted small" data-fsc-item-path="the-tavern" data-fsc-item-description-summary></p>
                    <div class="h4 text-primary" data-fsc-item-path="the-tavern" data-fsc-item-price></div>
                    
                    <div class="quantity-controls" data-fsc-item-path="the-tavern" data-fsc-item-selection-smartdisplay>
                        <label class="small text-uppercase fw-bold">Qty:</label>
                        <input type="number" 
                               class="qty-input" 
                               min="1" 
                               value="1" 
                               data-fsc-item-path="the-tavern" 
                               data-fsc-item-quantity-value 
                               data-fsc-autoapply>
                    </div>

                    <button class="btn btn-dark w-100 mt-2" 
                            data-fsc-item-path-value="the-tavern" 
                            data-fsc-action="Add"
                            data-fsc-item-path="the-tavern"
                            data-fsc-item-selection-smartdisplay-inverse>
                        Add to Cart
                    </button>

                    <button class="btn btn-outline-danger w-100 mt-2" 
                            data-fsc-item-path-value="the-tavern" 
                            data-fsc-action="Remove"
                            data-fsc-item-path="the-tavern"
                            data-fsc-item-selection-smartdisplay>
                        Remove from Cart
                    </button>
                    
                    <button class="btn btn-link btn-sm w-100 mt-2 text-dark" onclick="openFullDetails('the-tavern')">View Full Specs</button>
                </div>
            </div>

            </div>
    </section>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="text-center mb-4"><img id="modalImage" src="" class="img-fluid rounded" style="max-height: 300px;"></div>
                    <div id="modalDescription"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function onFscReady() { console.log("SBL Ready."); }

        function onFscOrderItemsChanged(data) {
            const checkout = document.getElementById('fsc-embedded-checkout-container');
            if (data.items.length > 0) {
                checkout.style.display = 'block';
                fastspring.builder.checkout();
            } else {
                checkout.style.display = 'none';
            }
        }

        window.fastspring = { builder: { "onOrderItemsChanged": onFscOrderItemsChanged } };

        function openFullDetails(path) {
            const modal = new bootstrap.Modal(document.getElementById('detailModal'));
            const item = fastspring.builder.item(path);
            if (item) {
                document.getElementById('modalTitle').innerText = item.display;
                document.getElementById('modalImage').src = item.image;
                document.getElementById('modalDescription').innerHTML = item.descriptionFull;
                modal.show();
            }
        }
    </script>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
