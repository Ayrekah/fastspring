<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Character Creator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        #fsc-embedded-checkout-container {
            min-height: 650px !important;
            margin: 40px auto;
            border: 1px solid #ddd;
            border-radius: 12px;
            display: none; 
            background: #fff;
        }
        .static-hero { background-color: #f3f5f7; padding: 60px 0; text-align: center; }
        .product-card { border: 1px solid #eee; padding: 30px; border-radius: 10px; transition: 0.3s; }
        .product-card:hover { border-color: #000; }
    </style>
</head>

<body>
    <header class="p-3 border-bottom bg-white sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="m-0">READY TO ROLL</h4>
            <div>Cart: <strong data-fsc-order-total>$0.00</strong></div>
        </div>
    </header>

    <section class="static-hero">
        <div class="container">
            <h1 class="display-4 text-uppercase">Level Up Your Lore.</h1>
            <p>Select a character tier to begin your journey.</p>
        </div>
    </section>

    <section class="container py-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="product-card h-100" data-fsc-item-path="the-tavern">
                    <img data-fsc-item-image src="https://googleusercontent.com/image_generation_content/4" class="img-fluid mb-3">
                    <h3 data-fsc-item-display>The Tavern</h3>
                    <p class="text-muted" data-fsc-item-description-summary>Randomized Starter</p>
                    <div class="h4 mb-3" data-fsc-item-price>$10.00</div>
                    <button type="button" onclick="addToCart('the-tavern')" class="btn btn-dark w-100 py-2 text-uppercase">
                        Add to Cart
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card h-100" data-fsc-item-path="hall-of-legends">
                    <img data-fsc-item-image src="https://googleusercontent.com/image_generation_content/6" class="img-fluid mb-3">
                    <h3 data-fsc-item-display>Hall of Legends</h3>
                    <p class="text-muted" data-fsc-item-description-summary>Vault of Heroes</p>
                    <div class="h4 mb-3" data-fsc-item-price>$25.00</div>
                    <button type="button" onclick="addToCart('hall-of-legends')" class="btn btn-dark w-100 py-2 text-uppercase">
                        Add to Cart
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card h-100" data-fsc-item-path="great-architect">
                    <img data-fsc-item-image src="https://googleusercontent.com/image_generation_content/9" class="img-fluid mb-3">
                    <h3 data-fsc-item-display>The Architect</h3>
                    <p class="text-muted" data-fsc-item-description-summary>Bespoke Commission</p>
                    <div class="h4 mb-3" data-fsc-item-price>$50.00</div>
                    <button type="button" onclick="addToCart('great-architect')" class="btn btn-dark w-100 py-2 text-uppercase">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
    </section>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <footer class="py-5 text-center text-muted border-top mt-5">
        <p>Ready to Roll | FastSpring Demo</p>
    </footer>

    <script type="text/javascript">
        // Manual Function to Bypass Template Conflicts
        function addToCart(path) {
            console.log("Ready to Roll: Manually adding " + path);
            
            // 1. Add the product
            fastspring.builder.add(path);
            
            // 2. Explicitly tell the container to show
            const container = document.getElementById('fsc-embedded-checkout-container');
            container.style.display = 'block';
            
            // 3. Command the checkout to render inside it
            fastspring.builder.checkout();
            
            // 4. Scroll down
            setTimeout(() => {
                container.scrollIntoView({ behavior: 'smooth' });
            }, 300);
        }

        // FastSpring Callback for Data Sync
        function onFscOrderItemsChanged(data) {
            console.log("Cart Data Sync:", data);
        }

        window.fastspring = {
            builder: {
                "onOrderItemsChanged": onFscOrderItemsChanged
            }
        };
    </script>
</body>
</html>
