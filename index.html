<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ready To Roll Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Ready To Roll</h1>
        <p>Select your adventure location</p>
    </header>

    <main class="store-container">
        <section class="products">
            <div class="product-card">
                <h3 data-fsc-item-path="the-tavern" data-fsc-item-display></h3>
                <p data-fsc-item-path="the-tavern" data-fsc-item-price></p>
                <button data-fsc-item-path-value="the-tavern" data-fsc-action="Add">Select Tavern</button>
            </div>

            <div class="product-card">
                <h3 data-fsc-item-path="the-campfire" data-fsc-item-display></h3>
                <p data-fsc-item-path="the-campfire" data-fsc-item-price></p>
                <button data-fsc-item-path-value="the-campfire" data-fsc-action="Add">Select Campfire</button>
            </div>

            <div class="product-card">
                <h3 data-fsc-item-path="the-guild-hall" data-fsc-item-display></h3>
                <p data-fsc-item-path="the-guild-hall" data-fsc-item-price></p>
                <button data-fsc-item-path-value="the-guild-hall" data-fsc-action="Add">Select Guild Hall</button>
            </div>
        </section>

        <section class="checkout-section">
            <h2>Complete Your Order</h2>

            <div class="order-summary">
                <h4>Your Selection:</h4>
                
                <div data-fsc-items-container>
                    <div data-fsc-item-path="the-tavern" data-fsc-item-selection-smartdisplay>
                        <p>
                            <span data-fsc-item-display></span> x <span data-fsc-item-quantity></span>
                            <span> — </span><span data-fsc-item-total></span>
                            <button data-fsc-action="Remove" class="btn-remove">Remove</button>
                        </p>
                    </div>

                    <div data-fsc-item-path="the-campfire" data-fsc-item-selection-smartdisplay>
                        <p>
                            <span data-fsc-item-display></span> x <span data-fsc-item-quantity></span>
                            <span> — </span><span data-fsc-item-total></span>
                            <button data-fsc-action="Remove" class="btn-remove">Remove</button>
                        </p>
                    </div>

                    <div data-fsc-item-path="the-guild-hall" data-fsc-item-selection-smartdisplay>
                        <p>
                            <span data-fsc-item-display></span> x <span data-fsc-item-quantity></span>
                            <span> — </span><span data-fsc-item-total></span>
                            <button data-fsc-action="Remove" class="btn-remove">Remove</button>
                        </p>
                    </div>
                </div>

                <hr>
                <p>Subtotal: <span data-fsc-order-total></span></p>
                <p>Tax: <span data-fsc-order-tax></span></p>
                <hr>
                <p><strong>Total: <span data-fsc-order-totalWithTax></span></strong></p>
                
                <button data-fsc-action="Reset" class="btn-reset">Clear All</button>
            </div>

            <div id="fsc-embedded-checkout-container"></div>
        </section>
    </main>

    <script
        id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-data-callback="orderUpdateCallback">
    </script>
    
    <script src="script.js"></script>
</body>
</html>
