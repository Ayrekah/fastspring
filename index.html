<!DOCTYPE html>
<html lang="en">

<head>
<title>Ready to Roll | FastSpring Demo</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">

<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
type="text/javascript"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
data-continuous="true"
data-debug="true">
</script>

<style>

.cart-drawer{
position:fixed;
top:0;
right:-400px;
width:400px;
height:100%;
background:white;
box-shadow:-5px 0 20px rgba(0,0,0,.15);
z-index:9999;
transition:right .3s ease;
padding:25px;
overflow-y:auto;
}

.cart-drawer.open{
right:0;
}

.cart-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
display:none;
z-index:9998;
}

.cart-overlay.show{
display:block;
}

#cart-count{
font-weight:700;
color:#0d6efd;
cursor:pointer;
}

.product-card{
background:white;
transition:all .2s;
}

.product-card:hover{
transform:translateY(-4px);
box-shadow:0 8px 20px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<header class="p-3 border-bottom sticky-top bg-white">
<div class="container d-flex justify-content-between align-items-center">

<strong>READY TO ROLL</strong>

<div onclick="toggleCart()">
Cart: <span id="cart-count">0</span> |
Total: <strong data-fsc-order-total></strong>
</div>

</div>
</header>

<section class="container py-5">

<div class="row g-4">

<!-- TAVERN -->

<div class="col-md-4">
<div class="product-card border rounded p-3 h-100 text-center">

<img data-fsc-item-path="the-tavern"
data-fsc-item-image
src=""
class="img-fluid rounded"
onclick="openFullDetails('the-tavern')">

<h3 class="mt-3"
data-fsc-item-path="the-tavern"
data-fsc-item-display></h3>

<p class="text-muted"
data-fsc-item-path="the-tavern"
data-fsc-item-description-summary></p>

<div class="h4 text-primary"
data-fsc-item-path="the-tavern"
data-fsc-item-price></div>

<button class="btn btn-dark w-100 mt-2"
data-fsc-action="Add"
data-fsc-item-path-value="the-tavern">
Add to Cart
</button>

<button class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-tavern')">
View Details
</button>

</div>
</div>

<!-- CAMPFIRE -->

<div class="col-md-4">
<div class="product-card border rounded p-3 h-100 text-center">

<img data-fsc-item-path="the-campfire"
data-fsc-item-image
src=""
class="img-fluid rounded"
onclick="openFullDetails('the-campfire')">

<h3 class="mt-3"
data-fsc-item-path="the-campfire"
data-fsc-item-display></h3>

<p class="text-muted"
data-fsc-item-path="the-campfire"
data-fsc-item-description-summary></p>

<div class="h4 text-primary"
data-fsc-item-path="the-campfire"
data-fsc-item-price></div>

<button class="btn btn-dark w-100 mt-2"
data-fsc-action="Add"
data-fsc-item-path-value="the-campfire">
Add to Cart
</button>

<button class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-campfire')">
View Details
</button>

</div>
</div>

<!-- GUILD HALL -->

<div class="col-md-4">
<div class="product-card border rounded p-3 h-100 text-center">

<img data-fsc-item-path="the-guild-hall"
data-fsc-item-image
src=""
class="img-fluid rounded"
onclick="openFullDetails('the-guild-hall')">

<h3 class="mt-3"
data-fsc-item-path="the-guild-hall"
data-fsc-item-display></h3>

<p class="text-muted"
data-fsc-item-path="the-guild-hall"
data-fsc-item-description-summary></p>

<div class="h4 text-primary"
data-fsc-item-path="the-guild-hall"
data-fsc-item-price></div>

<button class="btn btn-dark w-100 mt-2"
data-fsc-action="Add"
data-fsc-item-path-value="the-guild-hall">
Add to Cart
</button>

<button class="btn btn-outline-secondary w-100 mt-2"
onclick="openFullDetails('the-guild-hall')">
View Details
</button>

</div>
</div>

</div>
</section>

<!-- CART OVERLAY -->

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

<!-- CART DRAWER -->

<div class="cart-drawer" id="cartDrawer" data-fsc-order>

<h4>Your Cart</h4>

<div data-fsc-order-items>

<div data-fsc-item data-fsc-item-template
class="d-flex justify-content-between align-items-center border-bottom py-2">

<div>

<strong data-fsc-item-display></strong><br>

<span data-fsc-item-price></span>

</div>

<button class="btn btn-sm btn-outline-danger"
data-fsc-action="Remove">
Remove
</button>

</div>

</div>

<div class="mt-3">
Total: <strong data-fsc-order-total></strong>
</div>

<button class="btn btn-success w-100 mt-3"
data-fsc-action="Checkout">
Checkout
</button>

<div id="fsc-embedded-checkout-container" class="mt-4"></div>

</div>

<!-- PRODUCT MODAL -->

<div class="modal fade" id="detailModal" tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title" id="modalTitle"></h5>

<button type="button"
class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<div id="modalDescription"></div>

</div>

</div>

</div>

</div>

<script src="js/bootstrap.bundle.min.js"></script>

<script>

function toggleCart(){

const drawer=document.getElementById("cartDrawer");
const overlay=document.getElementById("cartOverlay");

drawer.classList.toggle("open");
overlay.classList.toggle("show");

}

function onFscOrderItemsChanged(data){

console.log("Order Updated:",data);

const cartCount=document.getElementById("cart-count");

let totalItems=0;

data.items.forEach(item=>{
totalItems+=item.quantity;
});

cartCount.innerText=totalItems;

if(totalItems>0){

document.getElementById("cartDrawer").classList.add("open");
document.getElementById("cartOverlay").classList.add("show");

fastspring.builder.checkout();

}

}

window.fastspring={
builder:{
onOrderItemsChanged:onFscOrderItemsChanged
}
}

function openFullDetails(path){

const item=fastspring.builder.item(path);

if(!item)return;

document.getElementById("modalTitle").innerText=item.display;

document.getElementById("modalDescription").innerHTML=item.description;

const modal=new bootstrap.Modal(document.getElementById("detailModal"));

modal.show();

}

</script>

</body>
</html>
