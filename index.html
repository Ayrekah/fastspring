<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Character Creator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        .product-card { padding: 20px; border: 1px solid #eee; height: 100%; transition: 0.3s; }
        .product-card:hover { border-color: #000; }
        #fsc-embedded-checkout-container { display: none; margin: 40px auto; min-height: 600px; }
        
        /* Cart List Styling */
        .cart-list-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        #cart-display-area { display: none; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; margin-top: 30px; }
    </style>
</head>

<body>
    <header class="p-3 border-bottom sticky-top bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <strong>READY TO ROLL</strong>
            <div class="text-end">
                <span>Total: <strong data-fsc-order-total></strong></span>
            </div>
        </div>
    </header>

    <section class="container py-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-tavern" data-fsc-item-image src="" onclick="openFullDetails('the-tavern')" class="img-fluid mb-3">
                    <h3 data-fsc-item-path="the-tavern" data-fsc-item-display></h3>
                    <p class="text-muted small" data-fsc-item-path="the-tavern" data-fsc-item-description-summary></p>
                    <div class="h4 text-primary" data-fsc-item-path="the-tavern" data-fsc-item-price></div>
                    <button class="btn btn-dark w-100 mt-2" data-fsc-item-path-value="the-tavern" data-fsc-action="Add">Add to Cart</button>
                    <button class="btn btn-link btn-sm w-100 mt-1 text-dark" onclick="openFullDetails('the-tavern')">View Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-campfire" data-fsc-item-image src="" onclick="openFullDetails('the-campfire')" class="img-fluid mb-3">
                    <h3 data-fsc-item-path="the-campfire" data-fsc-item-display></h3>
                    <p class="text-muted small" data-fsc-item-path="the-campfire" data-fsc-item-description-summary></p>
                    <div class="h4 text-primary" data-fsc-item-path="the-campfire" data-fsc-item-price></div>
                    <button class="btn btn-dark w-100 mt-2" data-fsc-item-path-value="the-campfire" data-fsc-action="Add">Add to Cart</button>
                    <button class="btn btn-link btn-sm w-100 mt-1 text-dark" onclick="openFullDetails('the-campfire')">View Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-guild-hall" data-fsc-item-image src="" onclick="openFullDetails('the-guild-hall')" class="img-fluid mb-3">
                    <h3 data-fsc-item-path="the-guild-hall" data-fsc-item-display></h3>
                    <p class="text-muted small" data-fsc-item-path="the-guild-hall" data-fsc-item-description-summary></p>
                    <div class="h4 text-primary" data-fsc-item-path="the-guild-hall" data-fsc-item-price></div>
                    <button class="btn btn-dark w-100 mt-2" data-fsc-item-path-value="the-guild-hall" data-fsc-action="Add">Add to Cart</button>
                    <button class="btn btn-link btn-sm w-100 mt-1 text-dark" onclick="openFullDetails('the-guild-hall')">View Details</button>
                </div>
            </div>

        </div>
    </section>

    <div id="cart-display-area" class="container p-4">
        <h4 class="text-uppercase border-bottom pb-2">Your Adventure Party</h4>
        <div data-fsc-items-container>
            <div class="cart-list-item">
                <div>
                    <strong data-fsc-item-display></strong> 
                    <span class="text-muted">x <span data-fsc-item-quantity></span></span>
                </div>
                <div>
                    <span data-fsc-item-total></span>
                    <button class="btn btn-sm btn-link text-danger" data-fsc-item-path-value data-fsc-action="Remove">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Character Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalDescription"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function onFscOrderItemsChanged(data) {
            const cartArea = document.getElementById('cart-display-area');
            const checkout = document.getElementById('fsc-embedded-checkout-container');

            if (data.items.length > 0) {
                cartArea.style.display = 'block';
                checkout.style.display = 'block';
                fastspring.builder.checkout();
            } else {
                cartArea.style.display = 'none';
                checkout.style.display = 'none';
            }
        }

        window.fastspring = {
            builder: { "onOrderItemsChanged": onFscOrderItemsChanged }
        };

        function openFullDetails(path) {
            const modalElement = document.getElementById('detailModal');
            const modal = new bootstrap.Modal(modalElement);
            
            // Re-fetching the item from the session to ensure data is live
            fastspring.builder.getItem(path, function(item) {
                if (item) {
                    document.getElementById('modalTitle').innerText = item.display;
                    document.getElementById('modalDescription').innerHTML = item.descriptionFull || "No detailed description available.";
                    modal.show();
                } else {
                    console.error("SBL: Could not find item data for " + path);
                }
            });
        }
    </script>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
