<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Character Creator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
    </script>

    <style>
        #fsc-embedded-checkout-container {
            display: none; 
            margin: 50px auto;
            max-width: 1100px;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            min-height: 600px;
        }
        .static-hero {
            background-color: #f3f5f7;
            padding: 100px 0;
        }
        /* Style for images to ensure they appear even before SBL loads them */
        .image-holder img {
            width: 100%;
            height: auto;
            min-height: 250px;
            background: #eee;
        }
    </style>
</head>

<body data-bs-spy="scroll" data-bs-target="#navbar">

    <header id="header" class="site-header header-scrolled position-fixed text-black bg-light">
        <nav id="header-nav" class="navbar navbar-expand-lg px-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <h2 class="text-uppercase m-0">Ready to Roll</h2>
                </a>
                <div class="d-flex align-items-center">
                    <span class="me-3 text-muted">Total: <strong class="text-dark" data-fsc-order-total>$0.00</strong></span>
                </div>
            </div>
        </nav>
    </header>

    <section id="billboard" class="static-hero position-relative overflow-hidden">
        <div class="container">
            <div class="row d-flex align-items-center">
                <div class="col-md-6">
                    <div class="banner-content">
                        <h1 class="display-2 text-uppercase text-dark pb-3">Craft Your Legend.</h1>
                        <p class="lead mb-5">Instant TTRPG character sheets and backstories.</p>
                        <a href="#ttrpg-products" class="btn btn-medium btn-dark text-uppercase btn-rounded-none">View Tiers</a>
                    </div>
                </div>
                <div class="col-md-5 offset-md-1">
                    <div class="image-holder">
                        <img src="https://googleusercontent.com/image_generation_content/5" alt="Hero" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="ttrpg-products" class="product-store position-relative padding-large">
        <div class="container">
            <div class="row g-4">
                
                <div class="col-md-4">
                    <div class="product-card border p-4 text-center">
                        <div class="image-holder">
                            <img data-fsc-item-path="the-tavern" data-fsc-item-image src="https://googleusercontent.com/image_generation_content/4" class="img-fluid">
                        </div>
                        <h3 class="mt-3 text-uppercase" data-fsc-item-path="the-tavern" data-fsc-item-display>The Tavern</h3>
                        <p class="small text-muted" data-fsc-item-path="the-tavern" data-fsc-item-description-summary>Randomized Starter Character</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="h4 m-0" data-fsc-item-path="the-tavern" data-fsc-item-price>$10.00</span>
                            <button data-fsc-item-path-value="the-tavern" data-fsc-action="Add" class="btn btn-dark btn-sm">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="product-card border p-4 text-center">
                        <div class="image-holder">
                            <img data-fsc-item-path="hall-of-legends" data-fsc-item-image src="https://googleusercontent.com/image_generation_content/6" class="img-fluid">
                        </div>
                        <h3 class="mt-3 text-uppercase" data-fsc-item-path="hall-of-legends" data-fsc-item-display>Hall of Legends</h3>
                        <p class="small text-muted" data-fsc-item-path="hall-of-legends" data-fsc-item-description-summary>Select a Pre-made Hero</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="h4 m-0" data-fsc-item-path="hall-of-legends" data-fsc-item-price>$25.00</span>
                            <button data-fsc-item-path-value="hall-of-legends" data-fsc-action="Add" class="btn btn-dark btn-sm">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="product-card border p-4 text-center">
                        <div class="image-holder">
                            <img data-fsc-item-path="great-architect" data-fsc-item-image src="https://googleusercontent.com/image_generation_content/9" class="img-fluid">
                        </div>
                        <h3 class="mt-3 text-uppercase" data-fsc-item-path="great-architect" data-fsc-item-display>The Architect</h3>
                        <p class="small text-muted" data-fsc-item-path="great-architect" data-fsc-item-description-summary>Bespoke Character Commission</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="h4 m-0" data-fsc-item-path="great-architect" data-fsc-item-price>$50.00</span>
                            <button data-fsc-item-path-value="great-architect" data-fsc-action="Add" class="btn btn-dark btn-sm">Add to Cart</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <script>
        function onFscOrderItemsChanged(data) {
            if (data.items.length > 0) {
                const checkout = document.getElementById('fsc-embedded-checkout-container');
                checkout.style.display = 'block';
                checkout.scrollIntoView({ behavior: 'smooth' });
            }
        }
        window.fastspring = { builder: { "onOrderItemsChanged": onFscOrderItemsChanged } };
    </script>
</body>
</html>
