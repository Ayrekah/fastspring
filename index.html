<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Shop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        .product-card { border: 1px solid #eee; padding: 20px; transition: 0.3s; background: #fff; }
        #fsc-embedded-checkout-container { display: none; min-height: 600px; margin-top: 30px; }
        
        /* The Cart Summary List */
        #cart-list-wrapper { display: none; border: 2px solid #000; padding: 20px; margin-top: 40px; }
        .cart-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>

<body>
    <header class="p-3 border-bottom sticky-top bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <strong>READY TO ROLL</strong>
            <div>Total: <span class="fw-bold" data-fsc-order-total></span></div>
        </div>
    </header>

    <section class="container py-5">
        <div class="row g-4 text-center">
            
            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-tavern" data-fsc-item-image src="" class="img-fluid mb-2">
                    <h4 data-fsc-item-path="the-tavern" data-fsc-item-display></h4>
                    <div class="h5 text-primary" data-fsc-item-path="the-tavern" data-fsc-item-price></div>
                    <button class="btn btn-dark btn-sm w-100 mt-2" data-fsc-item-path-value="the-tavern" data-fsc-action="Add">Add to Cart</button>
                    <button class="btn btn-link btn-sm text-dark" onclick="showDetails('the-tavern')">View Full Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-campfire" data-fsc-item-image src="" class="img-fluid mb-2">
                    <h4 data-fsc-item-path="the-campfire" data-fsc-item-display></h4>
                    <div class="h5 text-primary" data-fsc-item-path="the-campfire" data-fsc-item-price></div>
                    <button class="btn btn-dark btn-sm w-100 mt-2" data-fsc-item-path-value="the-campfire" data-fsc-action="Add">Add to Cart</button>
                    <button class="btn btn-link btn-sm text-dark" onclick="showDetails('the-campfire')">View Full Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img data-fsc-item-path="the-guild-hall" data-fsc-item-image src="" class="img-fluid mb-2">
                    <h4 data-fsc-item-path="the-guild-hall" data-fsc-item-display></h4>
                    <div class="h5 text-primary" data-fsc-item-path="the-guild-hall" data-fsc-item-price></div>
                    <button class="btn btn-dark btn-sm w-100 mt-2" data-fsc-item-path-value="the-guild-hall" data-fsc-action="Add">Add to Cart</button>
                    <button class="btn btn-link btn-sm text-dark" onclick="showDetails('the-guild-hall')">View Full Details</button>
                </div>
            </div>

        </div>
    </section>

    <div id="cart-list-wrapper" class="container">
        <h3 class="text-uppercase mb-4">Your Selection</h3>
        <div data-fsc-items-container>
            <div class="cart-row">
                <div>
                    <span data-fsc-item-display class="fw-bold"></span> 
                    <span class="text-muted ms-2">x <span data-fsc-item-quantity></span></span>
                </div>
                <div>
                    <span data-fsc-item-total class="me-3"></span>
                    <button class="btn btn-sm btn-outline-danger" data-fsc-item-path-value data-fsc-action="Remove">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="m-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body" id="m-desc"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        /**
         * CART LOGIC
         */
        function onFscOrderItemsChanged(data) {
            const cartList = document.getElementById('cart-list-wrapper');
            const checkout = document.getElementById('fsc-embedded-checkout-container');

            if (data.items && data.items.length > 0) {
                cartList.style.display = 'block';
                checkout.style.display = 'block';
                // Force checkout refresh
                fastspring.builder.checkout();
            } else {
                cartList.style.display = 'none';
                checkout.style.display = 'none';
            }
        }

        window.fastspring = {
            builder: { "onOrderItemsChanged": onFscOrderItemsChanged }
        };

        /**
         * MODAL LOGIC
         * We use the global 'fastspring' object to pull the 'descriptionFull'
         */
        function showDetails(path) {
            // Using the SBL item method
            const item = fastspring.builder.item(path);
            
            if (item) {
                document.getElementById('m-title').innerText = item.display;
                document.getElementById('m-desc').innerHTML = item.descriptionFull || "No description provided.";
                
                const myModal = new bootstrap.Modal(document.getElementById('detailsModal'));
                myModal.show();
            } else {
                console.warn("Product data not yet cached for: " + path);
            }
        }
    </script>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
