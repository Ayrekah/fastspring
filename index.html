		    <p class="product-price">

	<details class="product-full-description">

</section>

	<!-- CART -->
<!-- CART SECTION -->
<section class="cart">
  <div class="container">

    <!-- Empty Cart -->
    <div data-fsc-selections-smartdisplay data-fsc-filter="selected=false">
      <p>Your bag of holding is empty.</p>
    </div>

    <!-- Cart with Items -->
    <div data-fsc-selections-smartdisplay data-fsc-filter="selected=true">
      <h2>Your Cart</h2>

      <!-- Cart Items Container -->
      <div data-fsc-items-container="shopping-cart"></div>

      <!-- Subtotal -->
      <p style="margin-top:20px;">
        Subtotal: <strong><span data-fsc-order-subtotal></span></strong>
      </p>

      <!-- Action Buttons -->
      <button data-fsc-action="Checkout">Checkout</button>
      <button data-fsc-action="Reset">Clear Cart</button>
    </div>

  </div>
</section>

<!-- WORKING CART TEMPLATE -->
<script data-fsc-template-for="shopping-cart" type="text/x-handlebars-template">
{{#each items}}
  {{#each items}}
    <div class="cart-row" style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #c9b27c;">

      <!-- Product Name -->
      <span style="flex:2;">
        <strong>{{display}}</strong>
      </span>

      <!-- Editable Quantity -->
      <span style="flex:1; text-align:center;">
        <input type="number" value="{{quantity}}" min="1"
          data-fsc-item-quantity-value
          data-fsc-item-path-value="{{path}}"
          data-fsc-action="Update"
          style="width:50px; text-align:center;">
      </span>

      <!-- Item Total -->
      <span style="flex:1; text-align:right;">
        {{total}}
      </span>

      <!-- Remove Button -->
      <a data-fsc-action="Remove" data-fsc-item-path-value="{{path}}" style="margin-left:10px; cursor:pointer;">✕</a>

    </div>
  {{/each}}
{{/each}}
</script>

<!-- Embedded Checkout -->
<div class="container">
  <div id="fsc-embedded-checkout-container" data-fsc-order-selection-smartdisplay></div>
</div>

</body>
</html>
