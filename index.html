<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ready to Roll Test Store</title>

<script
id="fsc-api"
src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
type="text/javascript"
data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
data-debug="true">
</script>

</head>

<body>

<h1>Ready to Roll Test Store</h1>

<h2>Products</h2>

<!-- TAVERN -->
<div>

<img data-fsc-item-path="the-tavern" data-fsc-item-image width="200">

<div>
<span data-fsc-item-path="the-tavern" data-fsc-item-display></span>
</div>

<div>
Price:
<span data-fsc-item-path="the-tavern" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-tavern">
Add to Cart
</button>

</div>

<hr>

<!-- CAMPFIRE -->
<div>

<img data-fsc-item-path="the-campfire" data-fsc-item-image width="200">

<div>
<span data-fsc-item-path="the-campfire" data-fsc-item-display></span>
</div>

<div>
Price:
<span data-fsc-item-path="the-campfire" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-campfire">
Add to Cart
</button>

</div>

<hr>

<!-- GUILD HALL -->
<div>

<img data-fsc-item-path="the-guild-hall" data-fsc-item-image width="200">

<div>
<span data-fsc-item-path="the-guild-hall" data-fsc-item-display></span>
</div>

<div>
Price:
<span data-fsc-item-path="the-guild-hall" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Add"
data-fsc-item-path-value="the-guild-hall">
Add to Cart
</button>

</div>

<hr>

<h2>Cart</h2>

<!-- TAVERN CART LINE -->
<div data-fsc-item-path="the-tavern" data-fsc-item-selection-smartdisplay>

<strong>
<span data-fsc-item-path="the-tavern" data-fsc-item-display></span>
</strong>

<div>
Quantity:
<span data-fsc-item-path="the-tavern" data-fsc-item-quantity></span>
</div>

<div>
Price:
<span data-fsc-item-path="the-tavern" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Remove"
data-fsc-item-path-value="the-tavern">
Remove
</button>

</div>

<hr>

<!-- CAMPFIRE CART LINE -->
<div data-fsc-item-path="the-campfire" data-fsc-item-selection-smartdisplay>

<strong>
<span data-fsc-item-path="the-campfire" data-fsc-item-display></span>
</strong>

<div>
Quantity:
<span data-fsc-item-path="the-campfire" data-fsc-item-quantity></span>
</div>

<div>
Price:
<span data-fsc-item-path="the-campfire" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Remove"
data-fsc-item-path-value="the-campfire">
Remove
</button>

</div>

<hr>

<!-- GUILD HALL CART LINE -->
<div data-fsc-item-path="the-guild-hall" data-fsc-item-selection-smartdisplay>

<strong>
<span data-fsc-item-path="the-guild-hall" data-fsc-item-display></span>
</strong>

<div>
Quantity:
<span data-fsc-item-path="the-guild-hall" data-fsc-item-quantity></span>
</div>

<div>
Price:
<span data-fsc-item-path="the-guild-hall" data-fsc-item-price></span>
</div>

<button
data-fsc-action="Remove"
data-fsc-item-path-value="the-guild-hall">
Remove
</button>

</div>

<hr>

<h3>Order Summary</h3>

<div>
Subtotal:
<span data-fsc-order-subtotal></span>
</div>

<div>
Tax:
<span data-fsc-order-tax></span>
</div>

<div>
Total:
<span data-fsc-order-total></span>
</div>

<br>

<button data-fsc-action="Checkout">
Checkout
</button>

<button data-fsc-action="Reset">
Clear Cart
</button>

<hr>

<!-- Embedded checkout appears here -->
<div id="fsc-embedded-checkout-container"></div>

</body>
</html>
