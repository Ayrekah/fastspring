<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ready to Roll | TTRPG Character Creator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script id="fsc-api"
        src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
        type="text/javascript"
        data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll"
        data-debug="true">
    </script>

    <style>
        #fsc-embedded-checkout-container { min-height: 650px !important; margin: 40px auto; border: 1px solid #ddd; border-radius: 12px; display: none; background: #fff; }
        .product-card img { cursor: pointer; transition: 0.3s; width: 100%; height: auto; }
        .product-card img:hover { filter: brightness(0.8); }
        .modal-body img { max-width: 100%; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>

<body>
    <header class="p-3 border-bottom bg-white sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-uppercase">Ready to Roll</h4>
            <div>Cart Total: <strong data-fsc-order-total></strong></div>
        </div>
    </header>

    <section class="container py-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="product-card h-100 p-4 border rounded" data-fsc-item-path="the-tavern">
                    <img data-fsc-item-image src="" onclick="openQuickView('the-tavern')" alt="The Tavern">
                    <h3 class="mt-3" data-fsc-item-display></h3>
                    <p class="text-muted" data-fsc-item-description-summary></p>
                    <div class="h4 mb-3 text-primary" data-fsc-item-price></div>
                    
                    <button type="button" onclick="addToCart('the-tavern')" class="btn btn-dark w-100">Add to Cart</button>
                    <button type="button" onclick="openQuickView('the-tavern')" class="btn btn-link w-100 btn-sm text-dark mt-2">View Full Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card h-100 p-4 border rounded" data-fsc-item-path="hall-of-legends">
                    <img data-fsc-item-image src="" onclick="openQuickView('hall-of-legends')" alt="Hall of Legends">
                    <h3 class="mt-3" data-fsc-item-display></h3>
                    <p class="text-muted" data-fsc-item-description-summary></p>
                    <div class="h4 mb-3 text-primary" data-fsc-item-price></div>
                    <button type="button" onclick="addToCart('hall-of-legends')" class="btn btn-dark w-100">Add to Cart</button>
                    <button type="button" onclick="openQuickView('hall-of-legends')" class="btn btn-link w-100 btn-sm text-dark mt-2">View Full Details</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card h-100 p-4 border rounded" data-fsc-item-path="great-architect">
                    <img data-fsc-item-image src="" onclick="openQuickView('great-architect')" alt="Great Architect">
                    <h3 class="mt-3" data-fsc-item-display></h3>
                    <p class="text-muted" data-fsc-item-description-summary></p>
                    <div class="h4 mb-3 text-primary" data-fsc-item-price></div>
                    <button type="button" onclick="addToCart('great-architect')" class="btn btn-dark w-100">Add to Cart</button>
                    <button type="button" onclick="openQuickView('great-architect')" class="btn btn-link w-100 btn-sm text-dark mt-2">View Full Details</button>
                </div>
            </div>

        </div>
    </section>

    <div class="modal fade" id="quickViewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" class="img-fluid">
                    <div id="modalDescription" class="text-start p-3"></div>
                </div>
                <div class="modal-footer">
                    <button id="modalBuyBtn" class="btn btn-dark">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="fsc-embedded-checkout-container"></div>
    </div>

    <script type="text/javascript">
        // 1. ADD TO CART FUNCTION
        function addToCart(path) {
            fastspring.builder.add(path);
            const container = document.getElementById('fsc-embedded-checkout-container');
            container.style.display = 'block';
            fastspring.builder.checkout();
            
            setTimeout(() => { container.scrollIntoView({ behavior: 'smooth' }); }, 300);
        }
