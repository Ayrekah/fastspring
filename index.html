<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastSpring Embedded Checkout Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Buy Your Adventure!</h1>

<div id="products-container">
  <div class="product" data-product="the-tavern">
    <span class="name">The Tavern</span>
    <button class="decrease">–</button>
    <span class="quantity">0</span>
    <button class="increase">+</button>
  </div>

  <div class="product" data-product="the-campfire">
    <span class="name">The Campfire</span>
    <button class="decrease">–</button>
    <span class="quantity">0</span>
    <button class="increase">+</button>
  </div>

  <div class="product" data-product="the-guild-hall">
    <span class="name">The Guild Hall</span>
    <button class="decrease">–</button>
    <span class="quantity">0</span>
    <button class="increase">+</button>
  </div>
</div>

<div id="cart-summary">
  <h2>Cart Summary</h2>
  <div id="cart-items">No items in cart.</div>
  <button id="checkout-btn">Checkout</button>
</div>

<!-- FastSpring Embedded Checkout Script -->
<script
    id="fsc-api"
    src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js"
    type="text/javascript"
    data-storefront="ericateststore.test.onfastspring.com/embedded-readytoroll">
</script>

<script src="script.js"></script>

</body>
</html>
